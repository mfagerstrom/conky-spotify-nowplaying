-- Now-playing widget for Spotify (reads via playerctl / MPRIS).
-- GNOME on Wayland: conky runs through XWayland as a regular, undecorated window. Always on
-- top is the window manager's state for it, which conky-mouse.py sets and clears as the tray
-- menu's toggle changes, without restarting conky.
local conf = os.getenv('HOME') .. '/.config/conky-spotify-nowplaying/'

-- Start at the saved position (root-window x y, which conky-mouse.py keeps the window at), so
-- a restart does not show the window at conky's own spot first. Conky measures gap_x/gap_y
-- from the primary monitor's top left corner, in logical px (display scale from Xft.dpi).
local function run(cmd)
    local p = io.popen(cmd)
    local out = p:read('a') or ''
    p:close()
    return out
end
local gap_x, gap_y = 100, 100
local f = io.open(conf .. 'position')
if f then
    local x, y = f:read('n', 'n')
    f:close()
    local mx, my = run('xrandr --listmonitors'):match('%d+: %+%*%S+ %d+/%d+x%d+/%d+%+(%-?%d+)%+(%-?%d+)')
    local dpi = tonumber(run('xrdb -query'):match('Xft%.dpi:%s*(%d+)') or '') or 96
    local scale = math.max(math.floor(dpi / 96 + 0.5), 1)
    if x and y and mx then gap_x, gap_y = (x - mx) // scale, (y - my) // scale end
end

conky.config = {
    alignment = 'top_left',
    gap_x = gap_x,
    gap_y = gap_y,
    -- No size or margin here: the window is as big as nowplaying.py's markup, which carries
    -- the margins and the width, so a resize shows without restarting conky.
    minimum_width = 100,                            -- below any widget size, so the markup
    minimum_height = 50,                            -- alone sets the window's

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'ConkySpotifyNowPlaying',     -- conky-mouse.py finds the window by this
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,                      -- background is painted by draw.lua

    double_buffer = true,
    update_interval = 0.05,                         -- smooth seek bar / lyric scrolling (draw.lua)
    border_inner_margin = 0,                        -- border_width stays at its default: at 0,
                                                    -- mutter never shows the window
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    use_xft = true,
    font = 'Ubuntu Sans:size=1',                    -- tiny: it would set lines' least height
                                                    -- at every size; nowplaying.py sets every font
    -- nowplaying.py's markup sets every text colour through draw.lua's conky_fg, which
    -- follows the background; these are only conky's defaults.
    default_color = 'd0d0d0',
    color1 = '1db954',

    lua_load = (os.getenv('CSN_DIR') or '/usr/share/conky-spotify-nowplaying') .. '/draw.lua',
    lua_draw_hook_pre = 'draw_background',
    lua_draw_hook_post = 'draw_bar',
    lua_mouse_hook = 'mouse',                       -- hover only; clicks are handled by conky-mouse.py
};

-- Contents are generated by nowplaying.py (wrapping, like state, lyrics, album art), and
-- read by draw.lua's conky_widget on every update, so the text colours it sets follow the
-- background's fade frame by frame.
conky.text = [[
${lua_parse widget}\
]];
