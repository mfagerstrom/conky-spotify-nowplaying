-- Now-playing widget for Spotify (reads via playerctl / MPRIS).
-- GNOME on Wayland: conky runs through XWayland as an unmanaged ("override") window, so it
-- stays on top and receives clicks directly. conky-mouse.py places it at the saved position
-- (~/.config/conky/position); the gap below only matters until that helper starts.
conky.config = {
    alignment = 'top_left',
    gap_x = 100,
    gap_y = 100,
    -- Fixed width (text area; nowplaying.py wraps to fit). Height grows with the content.
    minimum_width = 505,
    maximum_width = 505,
    minimum_height = 108,                           -- artwork height minus nowplaying.py BOTTOM_TRIM

    own_window = true,
    own_window_type = 'override',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,                      -- background is painted by draw.lua

    double_buffer = true,
    update_interval = 0.05,                         -- smooth seek bar / lyric scrolling (draw.lua)
    border_inner_margin = 20,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    use_xft = true,
    font = 'Ubuntu Sans:size=13',
    default_color = 'd0d0d0',
    color1 = '1db954',
    color2 = 'ffffff',
    color3 = '808080',

    lua_load = os.getenv('HOME') .. '/.config/conky/draw.lua',
    lua_draw_hook_pre = 'draw_background',
    lua_draw_hook_post = 'draw_bar',
    lua_mouse_hook = 'mouse',                       -- hover only; clicks are handled by conky-mouse.py
};

-- Contents are generated by nowplaying.py (wrapping, like state, lyrics, album art).
conky.text = [[
${execpi 0.25 cat ~/.cache/conky-nowplaying/widget.txt}\
]];
